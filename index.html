<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/jpeg" href="/src/logo.jpg" />
    <meta name="description" content="A professor and institution rating platform for Vietnamese universities." />
    <meta property="og:title" content="RateVietProfs" />
    <meta property="og:description" content="A professor and institution rating platform for Vietnamese universities." />
    <title>RateVietProfs</title>
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('astra-theme');
          var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = (stored === 'light' || stored === 'dark') ? stored : (systemDark ? 'dark' : 'light');
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(resolved);
          document.documentElement.setAttribute('data-theme', resolved);
        } catch(e) {}
      })();
    </script>
    <!-- figma:head-end -->
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
